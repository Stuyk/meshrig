appId: com.stuyk.meshrig
productName: MeshRig

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

win:
  executableName: MeshRig
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ${productName}-Windows-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Windows-Portable-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  icon: build/icon.png
  category: Graphics;3DGraphics;Development;
  maintainer: Stuyk
  synopsis: Fast rigging for Blender meshes
  description: Rig any mesh in a .blend in minutes - skeleton, skin weights and IK.
  artifactName: ${productName}-Linux-${version}.${ext}

appImage:
  artifactName: ${productName}-Linux-${version}.${ext}

deb:
  artifactName: ${productName}-Linux-${version}.${ext}

mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: MeshRig requests access to your Documents folder to load and save 3D models.
    - NSDownloadsFolderUsageDescription: MeshRig requests access to your Downloads folder to load and save 3D models.
  notarize: false
  artifactName: ${productName}-macOS-${version}.${ext}

dmg:
  artifactName: ${productName}-macOS-${version}.${ext}

npmRebuild: false

publish:
  provider: github
  owner: stuyk
  repo: meshrig
  releaseType: draft
